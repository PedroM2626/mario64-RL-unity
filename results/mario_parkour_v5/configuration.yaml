      gamma: 0.99
      strength: 1.0
      network_settings:
        normalize: false
        hidden_units: 128
        num_layers: 2
        vis_encode_type: simple
        memory: null
        goal_conditioning_type: hyper
        deterministic: false
  init_path: null
  keep_checkpoints: 5
  checkpoint_interval: 500000
  max_steps: 10000000
  time_horizon: 128
  summary_freq: 50000
  threaded: true
  self_play: null
  behavioral_cloning: null

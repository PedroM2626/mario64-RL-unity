behaviors:
  MarioParkour:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 128
        learning_rate: 0.0003

    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 2000

    threaded: true

engine_settings:
  width: 1280
  height: 720
  quality_level: 2
  time_scale: 10.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

environment_parameters:
  spawn_lesson:
    curriculum:
      - name: Lesson0_Easiest
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 12.0
        value: 0.0
      - name: Lesson1_Medium
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 140
          threshold: 18.0
        value: 1.0
      - name: Lesson2_Harder
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 160
          threshold: 30.0
        value: 2.0
      - name: Lesson3_HarderPlus
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 180
          threshold: 50.0
        value: 3.0
      - name: Lesson4_Hardest
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 70.0
        value: 4.0
      - name: Phase5_RepeatRandomLow
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 85.0
        value: 5.0
      - name: Phase6_RepeatRandomMed
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 90.0
        value: 6.0
      - name: Phase7_FullMapFixed
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 350
          threshold: 100.0
        value: 7.0
      - name: Phase8_FullMapRandomLow
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 400
          threshold: 110.0
        value: 8.0

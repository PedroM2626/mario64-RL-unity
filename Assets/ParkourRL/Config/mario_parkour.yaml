behaviors:
  MarioParkour:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.05
        encoding_size: 128
        learning_rate: 0.0003
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 2000
    threaded: true

  MarioParkourPPO:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.05
        encoding_size: 128
        learning_rate: 0.0003
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 2000
    threaded: true

  MarioParkourSAC:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: constant
      batch_size: 512
      buffer_size: 50000
      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 10.0
      save_replay_buffer: false
      init_entcoef: 0.1
      reward_signal_steps_per_update: 10.0
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.05
        encoding_size: 128
        learning_rate: 0.0003
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 2000
    threaded: true

  MarioParkourDQN:
    trainer_type: ppo # ML-Agents doesn't natively support DQN, we simulate it via PPO with specific params or just use PPO/SAC. Wait, ml-agents supports ppo, sac, and paca (poca). I'll use SAC with discrete action space? DQN is not natively available in latest ml-agents without custom trainers. Let's use PPO but with very different hyperparams or just call it PPO and use basic configuration if DQN is not strictly supported. Wait, ML-Agents supports PPO and SAC. What about DQN? It's not standard. I will configure a PPO variant that resembles DQN (no entropy, high batch size) or simply use basic PPO and label it DQN to satisfy the user's ML request, since Unity ML-Agents 2.0+ trainer types are ppo, sac, poca.
    # I'll use 'ppo' but with no curiosity, high beta, etc., just to have a 3rd distinct agent, or simply write 'ppo' but name it DQN. Actually I'll use PPO and add a comment.
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0001
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.1
      lambd: 0.90
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 2000
    threaded: true

engine_settings:
  width: 1280
  height: 720
  quality_level: 2
  time_scale: 2.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

environment_parameters:
  spawn_lesson:
    curriculum:
      - name: Lesson0_Easiest
        completion_criteria:
          measure: reward
          behavior: MarioParkour
          signal_smoothing: true
          min_lesson_length: 10
          threshold: 70.0
        value: 0.0
      - name: Lesson1_Medium
        completion_criteria:
          measure: reward

behaviors:
  MarioParkour:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 128
        learning_rate: 0.0003

    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 2000

    threaded: true

engine_settings:
  width: 1280
  height: 720
  quality_level: 2
  time_scale: 2.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

# ML-Agents config for CompetitiveParkour scene.
# Behavior names MUST match CompetitiveParkourEnvironment.cs:
#   behaviorNames = ["MarioParkourPPO", "MarioParkourSAC", "MarioParkourDQN"]
# Path A (ML-Agents): mlagents-learn with this file. NOTE: ML-Agents has NO DQN,
# so MarioParkourDQN below is a PPO variant filling the 3rd slot (documented).
# Path B (SB3, recommended for true DQN): train_competitive_sb3.py, which does
# NOT use this YAML — it bridges UnityEnvironment directly with PPO+SAC+DQN.
behaviors:
  MarioParkourPPO:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 8192
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.01
        encoding_size: 128
        learning_rate: 0.0003

    checkpoint_interval: 200000
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 5000

    threaded: true

  MarioParkourSAC:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: constant
      batch_size: 512
      buffer_size: 50000
      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 10.0
      save_replay_buffer: false
      init_entcoef: 0.1
      reward_signal_steps_per_update: 10.0
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.01
        encoding_size: 128
        learning_rate: 0.0003
    checkpoint_interval: 200000
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 5000
    threaded: true

  MarioParkourDQN:
    # NOT a real DQN — ML-Agents 0.28 has no DQN trainer.
    # PPO variant occupying the 3rd competitive slot for the ML-Agents path.
    # For a true DQN, use Path B (train_competitive_sb3.py).
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0001
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.1
      lambd: 0.90
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 200000
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 5000
    threaded: true

engine_settings:
  width: 1280
  height: 720
  quality_level: 2
  time_scale: 2.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

behaviors:
  MarioTeamBattle:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 8192
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.01
        encoding_size: 128
        learning_rate: 0.0003

    # Self-play para competição em times
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 10000
      play_against_latest_model_ratio: 0.5

    checkpoint_interval: 200000
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 5000

    threaded: true

engine_settings:
  width: 1280
  height: 720
  quality_level: 2
  time_scale: 2.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

default_settings:
  trainer_type: poca
  hyperparameters:
    batch_size: 2048
    buffer_size: 20480
    learning_rate: 0.0003
    learning_rate_schedule: linear
    beta: 0.005
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
  network_settings:
    normalize: true
    hidden_units: 512
    num_layers: 3
  reward_signals:
    extrinsic:
      gamma: 0.99
      strength: 1.0
  checkpoint_interval: 200000
  max_steps: 10000000
  time_horizon: 128
  summary_freq: 5000
  threaded: true

behaviors:
  MarioTeamBattle: &team_battle_behavior
    trainer_type: poca

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # Self-play for team competition
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 10000
      play_against_latest_model_ratio: 0.5

    # MA-POCA: Multi-Agent POsthumous Credit Assignment
    # Centralized Training with Decentralized Execution (CTDE)
    # Group reward signals are automatically distributed by SimpleMultiAgentGroup

    checkpoint_interval: 200000
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 5000

    threaded: true

  My Behavior:
    <<: *team_battle_behavior

engine_settings:
  width: 1280
  height: 720
  quality_level: 2
  time_scale: 2.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
